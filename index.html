<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BIS Modernization: Investment Dashboard</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
/* ---- Salesforce palette, from Salesforce Corporate Template 2026.pptx theme1.xml ---- */
:root{
  --sf-navy:#001E5B; --sf-blue:#022AC0; --sf-cloud:#00B3FF; --sf-sky:#90D0FE;
  --sf-teal:#04E1CB; --sf-gold:#FCC003; --sf-pink:#FF538A; --sf-purple:#D17DFE;
  --sf-pale:#CFE9FE; --sf-link:#066AFE; --sf-tealdark:#0097A7;
  --red:#C0392B; --red-soft:#FDECEA; --green:#1D7324; --green-soft:#E6F4E6; --amber-soft:#FFF6DC;
  --card:#fff; --border:#e3e9f4; --text:#0b1b3b; --muted:#55638a; --faint:#8795b0;
  --bg:#eef2f9;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:14px; line-height:1.4; overflow:hidden;
}
#root{height:100vh;display:flex;flex-direction:column;}
a{color:var(--sf-link);text-decoration:none;} a:hover{text-decoration:underline;}

/* ---- Header ---- */
.hdr{background:linear-gradient(100deg,var(--sf-navy),var(--sf-blue));color:#fff;padding:12px 22px;flex-shrink:0;}
.hdr-top{display:flex;justify-content:space-between;align-items:center;gap:16px;}
.hdr h1{font-size:16px;font-weight:700;letter-spacing:.01em;}
.hdr .tag{font-size:11px;color:var(--sf-sky);text-transform:uppercase;letter-spacing:.1em;}
.hdr-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px;}
.conn{display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:600;color:#dce8ff;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:20px;padding:4px 11px;}
.led{width:9px;height:9px;border-radius:50%;flex-shrink:0;background:#889;}
.led.on{background:#2fe38a;box-shadow:0 0 0 0 rgba(47,227,138,.6);animation:pulse 2s infinite;}
.led.off{background:var(--sf-gold);}
.led.wait{background:var(--sf-sky);}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(47,227,138,.55);}70%{box-shadow:0 0 0 6px rgba(47,227,138,0);}100%{box-shadow:0 0 0 0 rgba(47,227,138,0);}}
.kpis{display:flex;gap:10px;margin-top:11px;}
.kpi{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.14);border-radius:9px;padding:9px 14px;flex:1;}
.kpi .v{font-size:21px;font-weight:800;line-height:1.1;}
.kpi .k{font-size:11px;color:var(--sf-sky);margin-top:1px;}
.kpi .s{font-size:9px;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:.06em;margin-top:3px;}

/* ---- Tabs ---- */
.tabs{display:flex;gap:4px;background:var(--card);border-bottom:1px solid var(--border);padding:0 18px;flex-shrink:0;}
.tabs button{background:none;border:none;font-family:inherit;font-size:13px;font-weight:600;color:var(--muted);
  padding:13px 16px;cursor:pointer;border-bottom:3px solid transparent;}
.tabs button:hover{color:var(--sf-blue);}
.tabs button.on{color:var(--sf-blue);border-bottom-color:var(--sf-cloud);}

/* ---- Stage (one screen) ---- */
.stage{flex:1;overflow:auto;padding:18px 22px;}
.stage-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;}
.stage-head h2{font-size:16px;color:var(--sf-navy);}
.stage-head .hint{font-size:12px;color:var(--faint);}

.card{background:var(--card);border:1px solid var(--border);border-radius:11px;box-shadow:0 1px 5px rgba(0,30,91,.05);}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;height:100%;}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}

/* ---- Overview: cost bar + donut-ish split ---- */
.pad{padding:16px 18px;}
.card h3{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);margin-bottom:12px;}
.bigfig{font-size:34px;font-weight:800;color:var(--sf-navy);}
.bar{display:flex;height:30px;border-radius:7px;overflow:hidden;margin:12px 0 8px;}
.bar span{display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700;}
.legend{display:flex;flex-direction:column;gap:9px;margin-top:6px;}
.legrow{display:flex;align-items:center;gap:10px;font-size:13px;}
.dot{width:11px;height:11px;border-radius:3px;flex-shrink:0;}
.legrow .amt{margin-left:auto;font-weight:800;color:var(--sf-navy);}
.legrow .sub{color:var(--muted);font-size:12px;}

.statline{display:flex;gap:12px;}
.stat{flex:1;text-align:center;padding:14px 8px;border-radius:10px;background:#f6f9ff;border:1px solid var(--border);}
.stat .n{font-size:34px;font-weight:800;color:var(--sf-blue);}
.stat.win{background:var(--green-soft);border-color:#bfe3bf;} .stat.win .n{color:var(--green);}
.stat .c{font-size:12px;color:var(--muted);margin-top:3px;}
.flag{display:inline-block;background:var(--amber-soft);border:1px solid #e8cf7a;color:#8A5A00;border-radius:12px;
  padding:1px 7px;font-size:10px;font-weight:600;margin-top:5px;}
.stat.click{cursor:pointer;transition:transform .08s,box-shadow .08s;}
.stat.click:hover{transform:translateY(-1px);box-shadow:0 3px 10px rgba(0,30,91,.12);}
.stat .more{font-size:10px;color:var(--sf-link);margin-top:4px;font-weight:600;}

/* ---- Modal ---- */
.ov{position:fixed;inset:0;background:rgba(5,16,43,.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:24px;}
.modal{background:#fff;border-radius:14px;max-width:520px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3);overflow:hidden;}
.modal-h{background:linear-gradient(100deg,var(--sf-navy),var(--sf-blue));color:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;}
.modal-h .t{font-size:15px;font-weight:700;}
.modal-h .x{background:rgba(255,255,255,.15);border:none;color:#fff;width:26px;height:26px;border-radius:6px;cursor:pointer;font-size:15px;}
.modal-b{padding:6px 20px 18px;}
.brow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #eef2f9;font-size:13px;}
.brow .bk{flex:1;}
.brow .bn{font-size:11px;color:var(--faint);}
.brow .bv{font-weight:800;color:var(--sf-navy);white-space:nowrap;}
.tagc{display:inline-block;border-radius:10px;padding:1px 7px;font-size:10px;font-weight:700;margin-left:6px;}
.tagc.s{background:var(--green-soft);color:var(--green);} .tagc.e{background:var(--amber-soft);color:#8A5A00;}
.btotal{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding:12px 14px;background:var(--sf-navy);color:#fff;border-radius:9px;}
.btotal .bv{font-size:22px;font-weight:800;}

/* ---- Tables ---- */
table{width:100%;border-collapse:collapse;}
th{background:var(--sf-navy);color:#fff;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;padding:9px 12px;position:sticky;top:0;}
td{padding:8px 12px;border-top:1px solid #eef2f9;font-size:13px;}
tr:nth-child(even) td{background:#fafcff;}
td.num{text-align:right;font-weight:700;color:var(--sf-navy);white-space:nowrap;}
.tblwrap{max-height:100%;overflow:auto;border-radius:11px;border:1px solid var(--border);background:#fff;}
tr.bisrow td{font-weight:800;color:var(--sf-navy);}

/* ---- Controls ---- */
.ctrls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.ctrls input,.ctrls select{border:1px solid var(--border);border-radius:7px;padding:7px 10px;font-size:13px;font-family:inherit;background:#fff;}
.btn{background:var(--sf-blue);color:#fff;border:none;border-radius:7px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;}
.btn:hover{background:var(--sf-navy);} .btn.sm{padding:5px 10px;font-size:12px;}
.btn.ghost{background:#fff;color:var(--sf-blue);border:1px solid #c3d2ee;}
.chip{display:inline-block;border-radius:20px;padding:2px 10px;font-size:11px;font-weight:700;}
.chip.live{background:var(--green-soft);color:var(--green);} .chip.cache{background:var(--amber-soft);color:#8A5A00;}
.chip.pill{background:#eef3ff;color:var(--sf-blue);border:1px solid #c3d2ee;cursor:pointer;font-weight:600;}
.chip.pill:hover{background:var(--sf-blue);color:#fff;}

/* ---- Forward ---- */
.reserve{display:flex;align-items:center;gap:16px;}
.gauge{flex:1;height:34px;border-radius:9px;background:#e3e9f4;overflow:hidden;display:flex;}
.gauge .spend{background:linear-gradient(90deg,var(--sf-blue),var(--sf-cloud));display:flex;align-items:center;padding-left:12px;color:#fff;font-weight:700;font-size:13px;}
.gauge .res{flex:1;display:flex;align-items:center;justify-content:flex-end;padding-right:12px;color:var(--green);font-weight:700;font-size:13px;}

/* ---- Before / after savings ---- */
.ba{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:stretch;}
.ba .side{border-radius:11px;padding:16px 18px;text-align:center;}
.ba .cur{background:var(--red-soft);border:1px solid #e8b4ac;}
.ba .fut{background:var(--green-soft);border:1px solid #bfe3bf;}
.ba .side .lab{font-size:11px;text-transform:uppercase;letter-spacing:.07em;font-weight:700;}
.ba .cur .lab{color:var(--red);} .ba .fut .lab{color:var(--green);}
.ba .side .big{font-size:30px;font-weight:800;margin:4px 0 2px;}
.ba .cur .big{color:var(--red);} .ba .fut .big{color:var(--green);}
.ba .side .sm{font-size:12px;color:var(--muted);}
.ba .arrow{display:flex;align-items:center;justify-content:center;color:var(--sf-blue);font-size:26px;font-weight:800;}
.saveband{background:var(--sf-navy);color:#fff;border-radius:11px;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;}
.saveband .big{font-size:26px;font-weight:800;}
.saveband .sky{color:var(--sf-sky);font-size:12px;}
.slider{display:flex;align-items:center;gap:12px;}
.slider input[type=range]{width:220px;accent-color:var(--sf-cloud);}
.slider .val{font-weight:800;font-size:17px;min-width:48px;}

/* ---- grid-term mapping strip (ties to George's whiteboard) ---- */
.terms{display:flex;gap:10px;}
.term{flex:1;background:#f6f9ff;border:1px solid var(--border);border-left:4px solid var(--sf-cloud);border-radius:9px;padding:10px 12px;}
.term .tk{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--sf-blue);}
.term .td{font-size:12px;color:var(--muted);margin-top:2px;}
.term.burden{border-left-color:var(--red);} .term.burden .tk{color:var(--red);}
.term.benefit{border-left-color:var(--green);} .term.benefit .tk{color:var(--green);}
.split2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}

/* ---- levers (what the investment attacks) ---- */
.levers{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;}
.lever{background:#f6f9ff;border:1px solid var(--border);border-top:4px solid var(--sf-teal);border-radius:10px;padding:14px 16px;}
.lever .lt{font-weight:800;color:var(--sf-navy);font-size:15px;margin-bottom:5px;}
.lever .ld{font-size:13px;color:var(--text);font-weight:600;line-height:1.5;}
.leadline{font-size:15px;color:var(--sf-navy);font-weight:600;line-height:1.5;}
.leadline.hero{font-size:18px;font-weight:800;}

.footer{flex-shrink:0;background:var(--sf-navy);color:#9fb6e0;font-size:11px;padding:7px 22px;display:flex;justify-content:space-between;gap:10px;}
.footer b{color:#fff;}
.src{font-size:11px;color:var(--faint);}
.src a{font-size:11px;}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect } = React;
const e = React.createElement;
const USA = "https://api.usaspending.gov/api/v2/search/spending_by_award/";
const award = (id)=>"https://www.usaspending.gov/award/"+id;
const fmt = (n)=> n>=1e9? "$"+(n/1e9).toFixed(1)+"B" : n>=1e6? "$"+(n/1e6).toFixed(1)+"M" : "$"+Math.round(n).toLocaleString();

/* ---- data ---- *
 * All BIS figures from Carahsoft/Salesforce Government Quote #65358510 (06/04/2026),
 * term 6/15/26–6/14/27. Full quote total was $4,940,621.79; BIS did NOT buy the Flosum
 * DevOps bundle ($412,371), so the purchased total is $4,528,251 (~$4.53M).               */
const QUOTE_BASE = 4528251;
// George's framing: ~$3.5M reusable infrastructure (bought once, reused every time) + ~$1M first app.
const COST = [
  {k:"Infrastructure, reused every time", v:3626774, color:"var(--sf-blue)", sub:"Orgs, licenses, Shield, GovCloud Plus, Data Cloud, Slack"},
  {k:"First application (OExS), step 1 of many", v:869700, color:"var(--sf-cloud)", sub:"The OExS build, the first app on the platform"},
  {k:"Flosum org", v:31777, color:"var(--sf-teal)", sub:"Service Cloud + Lightning Platform seats"}
];

// CURATED, VERIFIED Salesforce *license* awards (not consulting/staffing/integration).
// Each description explicitly states Salesforce licenses / ELA / SaaS subscription, and
// each award page was verified live on USAspending.gov (HTTP 200). TOTAL contract values.
const COMPS = [
  {agency:"Veterans Affairs", prog:"Salesforce ELA", amt:414057917, id:"CONT_AWD_36C10B19F0460_3600_NNG15SD27B_8000"},
  {agency:"Veterans Affairs", prog:"Salesforce licenses & subscriptions (SEWP)", amt:220097683, id:"CONT_AWD_36C10B26F0195_3600_NNG15SD27B_8000"},
  {agency:"USDA", prog:"Salesforce ELA (agency-wide)", amt:106789475, id:"CONT_AWD_12314425F0188_1205_12314424G0013_1205"},
  {agency:"CMS / HHS", prog:"Salesforce SaaS (FedRAMP)", amt:97140403, id:"CONT_AWD_75FCMC23F0140_7530_47QSWA18D008F_4732"},
  {agency:"State Dept", prog:"Salesforce ELA renewal", amt:59040420, id:"CONT_AWD_19AQMM26F0439_1900_NNG15SD27B_8000"},
  {agency:"CBP / DHS", prog:"Salesforce software licenses", amt:47867247, id:"CONT_AWD_70B04C22F00000617_7014_NNG15SD26B_8000"},
  {agency:"GSA", prog:"Salesforce CRM licensing", amt:39137706, id:"CONT_AWD_47QFDA25F0001_4732_47QTCA21A000R_4732"},
  {agency:"GSA", prog:"Salesforce licensing", amt:38492628, id:"CONT_AWD_47QFPA20F0040_4732_NNG15SC27B_8000"},
  {agency:"GSA", prog:"Salesforce ELA software", amt:35526662, id:"CONT_AWD_47HAA022F0146_4773_NNG15SC27B_8000"},
  {agency:"GSA", prog:"OneSBA Salesforce licenses", amt:32602852, id:"CONT_AWD_47QACA26F0067_4732_NNG15SC80B_8000"},
  {agency:"USDA", prog:"Salesforce license renewal", amt:30706229, id:"CONT_AWD_12314419F0500_1205_AG3144B150010_1205"},
  {agency:"Air Force", prog:"AFRS Salesforce licenses", amt:30062406, id:"CONT_AWD_FA701424F0087_9700_NNG15SC27B_8000"},
  {agency:"GSA", prog:"Salesforce ELA", amt:29071059, id:"CONT_AWD_GSH1416AA0233_4705_GS35F0119Y_4732"},
  {agency:"Air Force", prog:"Salesforce licenses & support", amt:25985755, id:"CONT_AWD_FA701423F0070_9700_NNG15SC27B_8000"},
  {agency:"CBP / DHS", prog:"Salesforce licenses", amt:25007828, id:"CONT_AWD_70B04C20F00001422_7014_HSHQDC13D00002_7001"},
  {agency:"CBP / DHS", prog:"Salesforce PaaS licenses", amt:24982017, id:"CONT_AWD_70B04C26F00000479_7014_47QSWA18D008F_4732"},
  {agency:"State Dept", prog:"Salesforce licenses", amt:24072338, id:"CONT_AWD_19AQMM23F1044_1900_NNG15SD27B_8000"},
  {agency:"Army", prog:"Salesforce enterprise license agreement", amt:23994842, id:"CONT_AWD_W519TC25C0037_9700_-NONE-_-NONE-"},
  {agency:"CBP / DHS", prog:"Salesforce licenses", amt:23304411, id:"CONT_AWD_70B04C19F00001350_7014_HSHQDC13D00026_7001"},
  {agency:"USDA", prog:"Salesforce license renewal", amt:20408120, id:"CONT_AWD_12314418F0448_1205_AG3144B150010_1205"},
  {agency:"Consumer Fin. Protection", prog:"Salesforce licenses", amt:18427341, id:"CONT_AWD_9531CB19F0017_955F_NNG15SC27B_8000"},
  {agency:"TSA / DHS", prog:"Salesforce software licenses", amt:17519628, id:"CONT_AWD_70T03026F7667N076_7013_NNG15SC27B_8000"},
  {agency:"GSA", prog:"Salesforce ELA", amt:16592573, id:"CONT_AWD_47HAA019F0205_4773_GS35F0119Y_4732"},
  {agency:"TSA / DHS", prog:"Salesforce SaaS licenses", amt:16482646, id:"CONT_AWD_70T03024F7667N096_7013_HSHQDC12D00012_7001"},
  {agency:"Small Business Admin", prog:"Salesforce DCMS/SVOG licenses", amt:15778974, id:"CONT_AWD_73351023F0026_7300_NNG15SD11B_8000"}
];
// Keep product/software buys (license, subscription, SaaS, platform, software), drop pure services.
const LICENSE_RX = /licen|subscription|\bela\b|saas|software|platform|seats?/i;
const EXCLUDE_RX = /\bstaff|consult|professional services|advisory|support services\b/i;
// Condense a verbose USAspending description into a short label. `vendor` is the search
// term so Palantir/Appian/etc. results aren't mislabeled "Salesforce".
function shortProg(d, vendor){
  const v = vendor ? (vendor.charAt(0).toUpperCase()+vendor.slice(1).toLowerCase()) : "Software";
  if(!d) return v+" licenses";
  d=d.replace(/[^A-Za-z0-9 .,\/&-]/g," ").replace(/\s+/g," ").trim();
  if(/\bela\b/i.test(d)) return v+" ELA";
  if(/paas/i.test(d)) return v+" PaaS";
  if(/saas|software as a service/i.test(d)) return v+" SaaS";
  if(/subscription/i.test(d)) return v+" subscriptions";
  if(/renew/i.test(d)) return v+" renewal";
  if(/platform/i.test(d)) return v+" platform";
  if(/licen/i.test(d)) return v+" licenses";
  return v+" software";
}
// BIS export-licensing paperwork burden — the collections the modernized system touches.
// Official BIS figures published in the Federal Register (pulled 10/1/26).
const BURDEN = [
  {omb:"0694-0122", title:"Export license applications & reporting", resp:2224151, hrs:97456, url:"https://www.federalregister.gov/documents/2025/12/19/2025-23439/agency-information-collection-activities-submission-to-the-office-of-management-and-budget-omb-for"},
  {omb:"0694-0047", title:"Technology classification requests", resp:5002, hrs:8945, url:"https://www.federalregister.gov/documents/2026/03/30/agency-information-collection-activities-submission-to-the-office-of-management-and-budget-omb-for"},
  {omb:"0694-0148", title:"Defense trade offset reports", resp:600, hrs:3126, url:"https://www.federalregister.gov/documents/2026/08/25/2026-17323/agency-information-collection-activities-submission-to-the-office-of-management-and-budget-omb-for"}
];
const SNAPSHOT = COMPS; // offline fallback for the live comps view
// THE BIS award itself — verified on USAspending.gov (awarded 2026-06-30, $4,528,250.66).
// Awarded through Dept of Commerce / Office of the Secretary (not under "BIS"), vendor is a
// Salesforce reseller, which is why a plain "BIS" search won't surface it.
const BIS_AWARD = {agency:"BIS (Commerce / Office of the Secretary)", prog:"Salesforce licenses, this project", amt:4528250.66, id:"CONT_AWD_1331L526F13OS1159_1301_NNG15SD74B_8000", bis:true};

/* ---- header ---- */
function Header(){
  const [conn,setConn]=useState("wait"); // wait | on | off
  useEffect(()=>{
    let live=true;
    fetch(USA,{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({filters:{award_type_codes:["A"],time_period:[{start_date:"2025-10-01",end_date:"2026-09-30"}]},fields:["Award ID"],limit:1})})
      .then(r=>{ if(live) setConn(r.ok?"on":"off"); })
      .catch(()=>{ if(live) setConn("off"); });
    return ()=>{ live=false; };
  },[]);
  const label = conn==="on"?"Connected · USAspending.gov" : conn==="off"?"Offline · cached data" : "Connecting…";
  return e("div",{className:"hdr"},
    e("div",{className:"hdr-top"},
      e("div",null,
        e("div",{className:"tag"},"BIS Modernization · Salesforce Investment")),
      e("div",{className:"hdr-right"},
        e("div",{className:"conn"}, e("span",{className:"led "+conn}), label))
    )
  );
}

/* ---- views ---- */
function Overview(){
  const total=COST.reduce((s,c)=>s+c.v,0);
  return e("div",{style:{height:"100%",display:"flex",alignItems:"flex-start",justifyContent:"center",paddingTop:"24px"}},
    e("div",{className:"card pad",style:{maxWidth:"920px",width:"100%",padding:"32px 36px"}},
      e("h3",null,"Initial investment"),
      e("div",{className:"bigfig",style:{fontSize:"46px"}},"$4.53M"),
      e("div",{className:"bar",style:{height:"44px",margin:"18px 0 14px"}},
        COST.map((c,i)=>e("span",{key:i,style:{width:(c.v/total*100)+"%",background:c.color,fontSize:"14px"},title:c.k}, c.v/total>0.12? fmt(c.v):""))
      ),
      e("div",{className:"legend",style:{gap:"14px"}},
        COST.map((c,i)=>e("div",{className:"legrow",key:i,style:{fontSize:"15px"}},
          e("span",{className:"dot",style:{background:c.color,width:"15px",height:"15px"}}),
          e("div",null, e("div",null,c.k), e("div",{className:"sub"},c.sub)),
          e("span",{className:"amt",style:{fontSize:"16px"}},fmt(c.v))
        ))
      ),
      e("div",{className:"leadline hero",style:{marginTop:"24px"}},
        "The licensing already covers far more than SNAP-R and OExS, it supports a full modernization of BIS:"),
      e("div",{className:"levers",style:{marginTop:"10px"}},
        e("div",{className:"lever"},
          e("div",{className:"lt"},"Intake & licensing"),
          e("div",{className:"ld"},"The export-license application process today, SNAP-R and OExS, modernized on one platform.")),
        e("div",{className:"lever"},
          e("div",{className:"lt"},"Case & enforcement"),
          e("div",{className:"ld"},"Review, classification, and enforcement workflows across the BIS divisions, on the same orgs and data.")),
        e("div",{className:"lever"},
          e("div",{className:"lt"},"Delivery & field communications"),
          e("div",{className:"ld"},"Coordination and communications out to BIS agents at the ports, built on licensing already paid for."))
      )
    )
  );
}

function Comps(){
  const [tabLive,setTabLive]=useState(false); // false = curated verified set, true = live explore
  const [kw,setKw]=useState("salesforce");
  const [rows,setRows]=useState([]);
  const [busy,setBusy]=useState(false);
  const [activeTerm,setActiveTerm]=useState("salesforce");
  const run=async(k)=>{
    setBusy(true); setTabLive(true);
    const term=(k&&k.trim())||"salesforce";
    setActiveTerm(term.toLowerCase());
    const f={keywords:[term],award_type_codes:["A","B","C","D"],time_period:[{start_date:"2017-10-01",end_date:"2026-09-30"}]};
    try{
      const r=await fetch(USA,{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({filters:f,fields:["Recipient Name","Award Amount","Awarding Agency","Awarding Sub Agency","generated_internal_id","Description"],sort:"Award Amount",order:"desc",limit:40})});
      if(!r.ok) throw 0;
      const d=await r.json();
      // Keep only license/subscription buys, drop services/consulting — same rule as the curated set.
      const mapped=(d.results||[])
        .filter(x=>{const dc=x["Description"]||""; return LICENSE_RX.test(dc) && !EXCLUDE_RX.test(dc);})
        .map(x=>({agency:x["Awarding Sub Agency"]||x["Awarding Agency"],prog:shortProg(x["Description"],term),amt:x["Award Amount"]||0,id:x["generated_internal_id"]}))
        .slice(0,15);
      setRows(mapped);
    }catch(_){ setRows([]); }
    setBusy(false);
  };
  const shown = tabLive ? rows : COMPS;
  // Only inject the BIS award when the view is Salesforce (default set, or a Salesforce search).
  // Don't let it pollute Palantir/Appian/ServiceNow searches.
  const isSF = !tabLive || activeTerm.includes("salesforce");
  const base = shown.filter(r=>r.id!==BIS_AWARD.id);
  const body = (isSF ? [BIS_AWARD].concat(base) : base).sort((a,b)=>b.amt-a.amt);
  return e("div",{style:{height:"100%",display:"flex",flexDirection:"column"}},
    e("div",{className:"stage-head"},
      e("div",{className:"ctrls"},
        e("input",{value:kw,onChange:ev=>setKw(ev.target.value),placeholder:"search licenses…",style:{minWidth:"150px"}}),
        e("button",{className:"btn",onClick:()=>run(kw)},busy?"…":"Search"),
        ["Salesforce","Palantir","Appian"].map(q=>
          e("span",{className:"chip pill",key:q,onClick:()=>{setKw(q);run(q);}},q)),
        tabLive? e("span",{style:{fontSize:"12px",color:"var(--sf-link)",cursor:"pointer"},onClick:()=>{setTabLive(false);setKw("salesforce");setActiveTerm("salesforce");}},"clear"):null
      )
    ),
    e("div",{className:"tblwrap",style:{flex:1}},
      e("table",null,
        e("thead",null,e("tr",null,["Agency","Award / recipient","Total award","Source"].map(h=>e("th",{key:h,style:h==="Total award"?{textAlign:"right"}:null},h)))),
        e("tbody",null,
          body.map((r,i)=>e("tr",{key:i,className:r.bis?"bisrow":""},
            e("td",null,r.agency),
            e("td",null,r.prog),
            e("td",{className:"num"},fmt(r.amt)),
            e("td",null, r.id? e("a",{href:award(r.id),target:"_blank",rel:"noopener"},"View ↗"):"·")
          ))
        )
      )
    )
  );
}

function Burden(){
  const totalHrs=BURDEN.reduce((s,b)=>s+b.hrs,0);
  const totalResp=BURDEN.reduce((s,b)=>s+b.resp,0);
  return e("div",{style:{height:"100%",display:"flex",flexDirection:"column",gap:"14px"}},
    e("div",{className:"statline"},
      e("div",{className:"stat"}, e("div",{className:"n"},totalResp.toLocaleString()), e("div",{className:"c"},"Exporter submissions a year")),
      e("div",{className:"stat"}, e("div",{className:"n"},totalHrs.toLocaleString()), e("div",{className:"c"},"Hours the public spends on them a year"))
    ),
    e("div",{className:"leadline"},"These are BIS's own figures, filed with OMB and published in the Federal Register."),
    e("div",{className:"tblwrap"},
      e("table",null,
        e("thead",null,e("tr",null,["Form / collection","Submissions a year","Hours a year","Published filing"].map(h=>e("th",{key:h,style:(h.indexOf("year")>-1)?{textAlign:"right"}:null},h)))),
        e("tbody",null, BURDEN.map((b,i)=>e("tr",{key:i},
          e("td",null,b.title),
          e("td",{className:"num"},b.resp.toLocaleString()),
          e("td",{className:"num"},b.hrs.toLocaleString()),
          e("td",null, e("a",{href:b.url,target:"_blank",rel:"noopener"},"View filing ↗"))
        )))
      )
    ),
    e("div",{className:"leadline hero",style:{marginTop:"8px"}},
      "A unified Salesforce + Palantir environment replaces the legacy SNAP-R path. Four ways that cuts into the burden above:"),
    e("div",{className:"levers",style:{marginTop:"10px"}},
      e("div",{className:"lever"},
        e("div",{className:"lt"},"Faster license adjudication"),
        e("div",{className:"ld"},"Pre-filled, pre-classified applications shorten the time from submission to decision.")),
      e("div",{className:"lever"},
        e("div",{className:"lt"},"Agentic help on the site"),
        e("div",{className:"ld"},"AI assists and deflects exporter questions at the point of filing, instead of staff answering by email.")),
      e("div",{className:"lever"},
        e("div",{className:"lt"},"Real-time observability"),
        e("div",{className:"ld"},"Live view of license volume, stage, and status, rather than waiting on periodic reports.")),
      e("div",{className:"lever"},
        e("div",{className:"lt"},"One record, no re-keying"),
        e("div",{className:"ld"},"Data is entered once and shared across divisions, not re-typed across siloed systems."))
    )
  );
}

function App(){
  const [tab,setTab]=useState("overview");
  const views={overview:Overview,comps:Comps,burden:Burden};
  const heads={
    overview:["$4.53M initial investment",""],
    comps:["",""],
    burden:["The problem it solves","The official paperwork burden today, and how the unified environment cuts into it."]
  };
  const V=views[tab];
  return e(React.Fragment,null,
    e(Header,null),
    e("div",{className:"tabs"},
      [["overview","1 · $4.53M initial investment"],["burden","2 · The problem it solves"],["comps","3 · What others paid"]].map(([id,l])=>
        e("button",{key:id,className:tab===id?"on":"",onClick:()=>setTab(id)},l))
    ),
    e("div",{className:"stage"},
      heads[tab][0]? e("div",{className:"stage-head"}, e("h2",null,heads[tab][0]), e("div",{className:"hint"},heads[tab][1])):null,
      e(V,null)
    ),
    e("div",{className:"footer"},
      e("div",null,e("b",null,"Sources:")," USAspending.gov · reginfo.gov / Federal Register.")
    )
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(e(App,null));
</script>
</body>
